name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python3 -m pip install pytest pyyaml "dulwich==1.2.14"

      - name: Run pytest
        run: python3 -m pytest tests/ -v

  guards:
    name: complexity and imports
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned tools
        run: python3 -m pip install "ruff==0.16.9" "import-linter==2.15"

      - name: Complexity may only go down
        run: python3 tools/complexity_ratchet.py

      - name: Import contracts
        run: lint-imports
