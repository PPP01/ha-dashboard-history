debug_snapshot:
  name: Debug snapshot
  description: >-
    Return the dashboard configurations as the integration currently sees
    them. Useful to check that the integration can read them at all.

history:
  name: History
  description: >-
    The recorded states of one dashboard, newest first. Each entry has a
    revision you can pass to the other services.
  fields:
    dashboard:
      required: true
      description: >-
        The dashboard key. That is its url_path, or "_default" for the
        default dashboard. Run debug_snapshot to see the keys.
      example: dashboard-karte
      selector:
        text:
    limit:
      description: How many entries to return at most.
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box

deleted_since:
  name: What disappeared
  description: >-
    List the cards and views that were present at the given revision and
    are gone now. Each carries a position for restore_deleted.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:

restore_deleted:
  name: Restore a deleted item
  description: >-
    Put a card or view back that disappeared after the given revision.
    Without confirm, only a preview of the change is returned.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    position:
      required: true
      description: Index from the deleted_since service.
      selector:
        number:
          min: 0
          mode: box
    confirm:
      description: Without this, nothing is written.
      default: false
      selector:
        boolean:

restore_state:
  name: Restore a whole state
  description: >-
    Set a dashboard back to the state it had at the given revision. This
    discards everything changed since. If the dashboard was deleted
    entirely, it is recreated with its old title and icon. Without
    confirm, only a preview of the change is returned.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    confirm:
      description: Without this, nothing is written.
      default: false
      selector:
        boolean:

undo_change:
  name: Undo one change
  description: >-
    Take a single change back and keep everything saved since. Only
    offered when it is provably exact: the cards the change produced
    must still be in the dashboard, unchanged and only once. Without
    confirm it answers with a preview and writes nothing.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    confirm:
      description: Without this, nothing is written.
      default: false
      selector:
        boolean:

describe:
  name: Describe a change
  description: >-
    Give one recorded change your own description. It becomes the
    headline of that entry; the automatic message stays below it. An
    empty text removes the description again. The commit itself is not
    rewritten, so every revision stays valid.
  fields:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    text:
      description: Your own words. Empty removes the description.
      default: ""
      example: Before rebuilding the heating cards
      selector:
        text:
          multiline: true

explain:
  name: Explain a change
  description: >-
    What one recorded change did, in plain words rather than as a diff.
    Cards and views by name, grouped by view.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: >-
        The change itself, from the history service - not the state
        before it.
      selector:
        text:

forget:
  name: Forget a deleted dashboard
  description: >-
    Remove a deleted dashboard's history for good. This cannot be undone.
    Only works on a dashboard Home Assistant no longer has. Without
    confirm, you get a count of what would be lost and nothing is
    changed. Note that this rewrites the stored history, so every
    revision changes - written-down revisions will no longer resolve.
  fields:
    dashboard:
      required: true
      description: >-
        The key of a deleted dashboard. Run the history service on it
        first if you want to see what is there.
      example: dashboard-erika
      selector:
        text:
    confirm:
      description: Without this, nothing is removed.
      default: false
      selector:
        boolean:

next_versions:
  name: Next version numbers
  description: >-
    What the next patch, minor and major version of a dashboard would be
    called. Reads only; it creates nothing.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:

create_version:
  name: Create a version
  description: >-
    Mark a recorded state of one dashboard as a version. It groups the
    changes below it; it never squashes them. Nothing on the dashboard
    changes, so this needs no confirmation.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:
    level:
      description: >-
        How far to count up. The number itself is worked out from the
        highest version this dashboard already has.
      default: patch
      selector:
        select:
          options:
            - patch
            - minor
            - major
    title:
      required: true
      example: Kitchen rework
      selector:
        text:
    description:
      description: What this version is about.
      default: ""
      selector:
        text:
          multiline: true
    revision:
      description: >-
        Which recorded state to mark. Defaults to the most recent one.
      selector:
        text:

versions:
  name: Versions
  description: >-
    The named points in the history. Give a dashboard to see only its
    own, ordered by version number.
  fields:
    dashboard:
      description: The dashboard, by its url_path. Leave empty for all.
      example: my-dashboard
      selector:
        text:
