debug_snapshot:
  name: Debug snapshot
  description: >-
    Return the dashboard configurations as the integration currently sees
    them. Useful to check that the integration can read them at all.

history:
  name: History
  description: >-
    The recorded states of one dashboard, newest first. Each entry has a
    revision you can pass to the other services.
  fields:
    dashboard:
      required: true
      description: >-
        The dashboard key. That is its url_path, or "_default" for the
        default dashboard. Run debug_snapshot to see the keys.
      example: dashboard-karte
      selector:
        text:
    limit:
      description: How many entries to return at most.
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box

search:
  name: Search
  description: >-
    Find recorded changes of one dashboard by their words. Searches the
    whole history, not just the newest entries, and looks at the
    automatic message, any description you wrote yourself, and the
    title, description and number of any version sitting on that state.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:
    text:
      required: true
      description: The words to look for. Capitals do not matter.
      example: heating
      selector:
        text:
    limit:
      description: How many matches at most. The answer says whether there were more.
      default: 50
      selector:
        number:
          min: 1
          max: 1000
          mode: box

deleted_since:
  name: What disappeared
  description: >-
    List the cards and views that were present at the given revision and
    are gone now. Each carries a position for restore_deleted.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:

restore_deleted:
  name: Restore a deleted item
  description: >-
    Put a card or view back that disappeared after the given revision.
    Without confirm, only a preview of the change is returned.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    position:
      required: true
      description: Index from the deleted_since service.
      selector:
        number:
          min: 0
          mode: box
    confirm:
      description: Without this, nothing is written.
      default: false
      selector:
        boolean:

restore_state:
  name: Restore a whole state
  description: >-
    Set a dashboard back to the state it had at the given revision. This
    discards everything changed since. If the dashboard was deleted
    entirely, it is recreated with its old title and icon. Without
    confirm, only a preview of the change is returned.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    confirm:
      description: Without this, nothing is written.
      default: false
      selector:
        boolean:
    keep_as_version:
      description: >-
        Mark the state you are leaving, so it can be found again by name.
        Give a title, and optionally a level (patch, minor, major) and a
        description. The mark is made after the state is safely in the
        history and before the older one is written, which is the only
        moment it is the state you saw. Leave this out to change nothing;
        nothing is deleted either way.
      example: '{"level": "minor", "title": "Before going back"}'
      selector:
        object:

undo_change:
  name: Undo one change
  description: >-
    Take a single change back and keep everything saved since. Only
    offered when it is provably exact: the cards the change produced
    must still be in the dashboard, unchanged and only once. Without
    confirm it answers with a preview and writes nothing.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    confirm:
      description: Without this, nothing is written.
      default: false
      selector:
        boolean:

describe:
  name: Describe a change
  description: >-
    Give one recorded change your own description. It becomes the
    headline of that entry; the automatic message stays below it. An
    empty text removes the description again. The commit itself is not
    rewritten, so every revision stays valid.
  fields:
    revision:
      required: true
      description: A revision from the history service.
      selector:
        text:
    text:
      description: Your own words. Empty removes the description.
      default: ""
      example: Before rebuilding the heating cards
      selector:
        text:
          multiline: true

explain:
  name: Explain a change
  description: >-
    What one recorded change did, in plain words rather than as a diff.
    Cards and views by name, grouped by view.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision:
      required: true
      description: >-
        The change itself, from the history service - not the state
        before it.
      selector:
        text:

compare:
  name: Compare two states
  description: >-
    The full difference between any two states of one dashboard - not
    necessarily adjacent ones, and either side may be left out to mean
    the dashboard's current live state.
  fields:
    dashboard:
      required: true
      example: dashboard-karte
      selector:
        text:
    revision_a:
      description: >-
        One side of the comparison. Left out, this side means the
        current live state - at least one of the two must be an actual
        revision.
      selector:
        text:
    revision_b:
      description: The other side, same rule.
      selector:
        text:

forget:
  name: Forget a deleted dashboard
  description: >-
    Remove a deleted dashboard's history for good. This cannot be undone.
    Only works on a dashboard Home Assistant no longer has. Without
    confirm, you get a count of what would be lost and nothing is
    changed. Note that this rewrites the stored history, so every
    revision changes - written-down revisions will no longer resolve.
  fields:
    dashboard:
      required: true
      description: >-
        The key of a deleted dashboard. Run the history service on it
        first if you want to see what is there.
      example: dashboard-erika
      selector:
        text:
    confirm:
      description: Without this, nothing is removed.
      default: false
      selector:
        boolean:

next_versions:
  name: Next version numbers
  description: >-
    What the next patch, minor and major version of a dashboard would be
    called. Reads only; it creates nothing.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:

create_version:
  name: Create a version
  description: >-
    Mark a recorded state of one dashboard as a version. It groups the
    changes below it; it never squashes them. Nothing on the dashboard
    changes, so this needs no confirmation.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:
    level:
      description: >-
        How far to count up. The number itself is worked out from the
        highest version this dashboard already has.
      default: patch
      selector:
        select:
          options:
            - patch
            - minor
            - major
    title:
      required: true
      example: Kitchen rework
      selector:
        text:
    description:
      description: What this version is about.
      default: ""
      selector:
        text:
          multiline: true
    revision:
      description: >-
        Which recorded state to mark. Defaults to the most recent one.
      selector:
        text:

retitle_version:
  name: Rename a version
  description: >-
    Give a version that already exists a new title and description. The
    version number stays as it is - it is part of the tag's name, which
    other things address the version by. Nothing on the dashboard
    changes, so this needs no confirmation.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:
    name:
      required: true
      description: >-
        The version to rename, by its full name as `versions` reports it.
      example: my-dashboard/v1.0.0
      selector:
        text:
    title:
      required: true
      description: >-
        The new title. A version cannot be left without one, so this
        cannot be emptied.
      example: Before the kitchen rework
      selector:
        text:
    description:
      description: >-
        The new description. Leave it empty to remove the one that is
        there.
      default: ""
      selector:
        text:
          multiline: true

remove_version:
  name: Remove a version
  description: >-
    Take a version's mark away. The state it marks stays in the history
    and remains findable in the advanced view - only the name goes, along
    with the title and description you gave it, and those cannot be
    written back. Without confirm, you get the version's own words and
    nothing changes. That answer also says whether the version carries
    the highest number - then it is free again and the next patch will
    use it - and, in `returns`, whether the automatic day marking would
    create this one again at the next save. `returns` is false for
    anything you named yourself, and for a day mark that a later day
    has already left behind: removing that one is permanent.
  fields:
    dashboard:
      required: true
      description: The dashboard, by its url_path.
      example: my-dashboard
      selector:
        text:
    name:
      required: true
      description: >-
        The version to remove, by its full name as `versions` reports it.
      example: my-dashboard/v1.0.0
      selector:
        text:
    confirm:
      description: Without this, nothing is removed.
      default: false
      selector:
        boolean:

versions:
  name: Versions
  description: >-
    The named points in the history. Give a dashboard to see only its
    own, ordered by version number, each saying whether it is the state
    the dashboard holds right now and whether it was made automatically.
  fields:
    dashboard:
      description: The dashboard, by its url_path. Leave empty for all.
      example: my-dashboard
      selector:
        text:
