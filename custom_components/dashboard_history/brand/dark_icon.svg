<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Brand icon for dashboard_history (Dark Theme)
    Solid colors only - guaranteed compatibility across all SVG renderers.
  -->
